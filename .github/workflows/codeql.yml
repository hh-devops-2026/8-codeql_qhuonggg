
name: CodeQL and Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: security-extended

      - name: Analyze code
        uses: github/codeql-action/analyze@v4

  docker-ci:
    name: Docker Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t go-web-server .

      - name: Start Docker container
        run: |
          docker run -d --name go-web-test -p 127.0.0.1:8080:8080 go-web-server

      
      - name: Test readfile endpoint
        run: |
          set -e

          echo "Waiting for Go web server..."

          for i in {1..30}; do
            if curl --fail --silent \
              "http://127.0.0.1:8080/readfile?file=safe-files/hello.txt" \
              -o response.txt; then
              echo "Server responded successfully"
              break
            fi

            sleep 2
          done

          echo "Checking response..."
          test -s response.txt

          echo "Response:"
          cat response.txt

          echo "Hello World" > expected.txt
          diff -u expected.txt response.txt

          echo "Docker endpoint test passed!"

      - name: Stop Docker container
        if: always()
        run: docker rm -f go-web-test || true
